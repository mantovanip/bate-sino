<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090806">
<title>Bate Sino</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#090806}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;color:#f5ead0;font-family:system-ui,-apple-system,sans-serif;user-select:none;touch-action:manipulation;background:radial-gradient(circle at 50% 42%,#33291b 0,#15110b 42%,#070605 100%)}
main{min-height:100svh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px}
h1{margin:0 0 7px;font-size:clamp(32px,10vw,54px);letter-spacing:-.045em;font-weight:800}
p{margin:0 0 38px;color:#ad9b79;font-size:15px}
.bell-wrap{appearance:none;border:0;background:none;position:relative;width:min(82vw,340px);aspect-ratio:1;display:grid;place-items:center;cursor:pointer;padding:0}
.bell{position:relative;width:61%;height:64%;transform-origin:50% 8%;filter:drop-shadow(0 28px 25px rgba(0,0,0,.6))}
.bell-body{position:absolute;left:4%;right:4%;bottom:9%;height:75%;border-radius:50% 50% 18% 18%/20% 20% 10% 10%;background:linear-gradient(105deg,#5d3c12 0%,#a87324 13%,#e1b95d 29%,#80551a 45%,#d6a642 61%,#68430f 78%,#b47b25 92%,#4e310c 100%);box-shadow:inset -12px -10px 18px rgba(38,20,3,.58),inset 10px 8px 16px rgba(255,224,145,.3),inset 0 0 0 2px rgba(255,211,102,.18)}
.bell-body:after{content:"";position:absolute;left:16%;right:16%;top:24%;height:2px;background:rgba(75,43,8,.45);box-shadow:0 7px 0 rgba(255,216,121,.12)}
.bell-rim{position:absolute;left:0;right:0;bottom:6%;height:18%;border-radius:50%;background:linear-gradient(#d8ad52 0%,#75480e 45%,#3e2508 100%);box-shadow:inset 0 5px 5px rgba(255,231,160,.38),inset 0 -5px 7px rgba(30,15,2,.55),0 6px 9px rgba(0,0,0,.45)}
.bell-top{position:absolute;left:37%;top:0;width:26%;height:19%;border-radius:50% 50% 30% 30%;background:linear-gradient(105deg,#6a430e,#e1b958 42%,#825414 72%,#c28b2d);box-shadow:inset 3px 3px 5px rgba(255,229,155,.35)}
.bell-knob{position:absolute;left:41%;top:-5%;width:18%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,#f4d681,#b67b22 48%,#563609 100%);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.clapper{position:absolute;left:40%;bottom:0;width:20%;height:26%;border-radius:45%;background:linear-gradient(90deg,#57370a,#d3a33f 45%,#68420c);box-shadow:0 3px 4px rgba(0,0,0,.45)}
.hint{margin-top:34px;color:#8f7b59;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.bell-wrap.active .bell{animation:ring .62s cubic-bezier(.36,.07,.19,.97)}
@keyframes ring{0%,100%{transform:rotate(0)}12%{transform:rotate(13deg)}25%{transform:rotate(-12deg)}38%{transform:rotate(10deg)}51%{transform:rotate(-8deg)}64%{transform:rotate(5deg)}77%{transform:rotate(-3deg)}90%{transform:rotate(1deg)}}
@media(prefers-reduced-motion:reduce){.bell-wrap.active .bell{animation-duration:.3s}}
</style>
</head>
<body>
<main>
<h1>Bate Sino</h1>
<p>Um toque. Um sino.</p>
<button class="bell-wrap" id="bellButton" aria-label="Bater o sino">
<div class="bell"><div class="bell-knob"></div><div class="bell-top"></div><div class="bell-body"></div><div class="clapper"></div><div class="bell-rim"></div></div>
</button>
<div class="hint">Toque no sino</div>
</main>
<script>
let audio=null;
let audioReady=false;

function makeBellWav(){
  const sr=44100, duration=3;
  const n=sr*duration;
  const buffer=new ArrayBuffer(44+n*2);
  const view=new DataView(buffer);
  const write=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
  write(0,"RIFF");
  view.setUint32(4,36+n*2,true);
  write(8,"WAVE");
  write(12,"fmt ");
  view.setUint32(16,16,true);
  view.setUint16(20,1,true);
  view.setUint16(22,1,true);
  view.setUint32(24,sr,true);
  view.setUint32(28,sr*2,true);
  view.setUint16(32,2,true);
  view.setUint16(34,16,true);
  write(36,"data");
  view.setUint32(40,n*2,true);

  const p=[
    [196,1,3.0],[393,.62,2.6],[588,.42,2.25],
    [785,.28,2.0],[1037,.22,1.75],[1375,.15,1.55],
    [1760,.10,1.35],[2310,.06,1.1],[2940,.04,.9]
  ];

  let peak=0;
  const samples=new Float32Array(n);
  for(let i=0;i<n;i++){
    const t=i/sr;
    let s=0;
    for(const [f,a,d] of p)s+=a*Math.exp(-t*d)*Math.sin(2*Math.PI*f*t);
    s+=.12*Math.exp(-t*35)*Math.sin(2*Math.PI*3200*t);
    s+=.10*Math.exp(-t*8)*Math.sin(2*Math.PI*110*t);
    samples[i]=s;
    if(Math.abs(s)>peak)peak=Math.abs(s);
  }
  for(let i=0;i<n;i++){
    let s=samples[i]/peak*.9;
    s=Math.max(-1,Math.min(1,s));
    view.setInt16(44+i*2,s*32767,true);
  }
  return new Blob([buffer],{type:"audio/wav"});
}

function prepareAudio(){
  if(audioReady)return;
  const blob=makeBellWav();
  audio=new Audio(URL.createObjectURL(blob));
  audio.preload="auto";
  audio.setAttribute("playsinline","");
  audioReady=true;
}

async function ring(){
  prepareAudio();
  audio.pause();
  audio.currentTime=0;
  try{
    await audio.play();
  }catch(e){
    console.warn("Falha ao reproduzir o sino",e);
  }
}

const b=document.getElementById("bellButton");

b.addEventListener("pointerdown",async(e)=>{
  e.preventDefault();
  b.classList.remove("active");
  void b.offsetWidth;
  b.classList.add("active");
  if(navigator.vibrate)navigator.vibrate([25,15,35]);
  await ring();
},{passive:false});

b.addEventListener("animationend",()=>b.classList.remove("active"));
</script>
</body>
</html>
